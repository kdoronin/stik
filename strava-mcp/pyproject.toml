[project]
name = "hermes-strava-mcp"
version = "0.1.0"
description = "Local read-only Strava MCP connector for Hermes"
requires-python = ">=3.11"
dependencies = ["mcp>=1.23,<2"]

[project.scripts]
strava-mcp = "strava_mcp.server:main"
strava-auth = "strava_mcp.auth_cli:main"
strava-wiki-sync = "strava_mcp.wiki_sync:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strava_mcp"]
